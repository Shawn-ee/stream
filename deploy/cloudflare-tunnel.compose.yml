name: stream-cloudflare-tunnel

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    restart: unless-stopped
    env_file: ${TUNNEL_ENV_FILE:-.env.tunnel}
    command: ["tunnel", "--no-autoupdate", "--loglevel", "info", "run"]
    networks:
      - stream

networks:
  stream:
    external: true
    name: stream-launch-candidate_default
