server {
  listen 80;
  server_name _;
  client_max_body_size 64k;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 'ok'; }

  location ^~ /internal/ {
    return 404;
  }
  location = /api/streamer/avatar {
    client_max_body_size 6m;
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/ { proxy_pass http://api:3001; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /socket.io/ { proxy_pass http://api:3001; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 65s; }
  location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
